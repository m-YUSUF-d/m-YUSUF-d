name: Update Profile

on:
  schedule:
    - cron: "23 2 * * *"   # her gün 02:23 UTC
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      # -------------------------------------------------
      # 1) Medium'da yeni yazı varsa profile yaz
      # -------------------------------------------------
      - name: Update Medium posts
        run: python fetch_medium.py

      # -------------------------------------------------
      # 2) Profildeki metni (facts) güncelle
      # -------------------------------------------------
      - name: Update profile facts
        run: python update_facts.py

      # -------------------------------------------------
      # 3) Streak SVG'yi güncelle
      # -------------------------------------------------
      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@v1.7.0
        with:
          options: user=${{ github.repository_owner }}&theme=dark&disable_animations=false
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------------------------------
      # Değişiklik varsa tek commit'te gönder
      # -------------------------------------------------
      - name: Check for changes
        id: check_changes
        run: |
          git add README.md profile/streak.svg
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push all changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "<135694743>+m-yusuf-d@users.noreply.github.com"
          git config --local user.name "m-yusuf-d"
          git commit -m "📝 Update profile - $(date -u '+%Y-%m-%d -- %H:%M (UTC +0)')"
          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "✅ Değişiklik yok, commit oluşturulmadı."