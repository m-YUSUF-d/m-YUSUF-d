name: Update Profile

on:
  schedule:
    - cron: "7 1 * * *"

  workflow_dispatch:

  push:
    paths:
      - ".github/workflows/update-profile.yml"

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # -------------------------
      # Python / README updates
      # -------------------------

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser

      - name: List files (debug)
        run: |
          echo "Current directory:"
          pwd
          echo "Files in root:"
          ls -la

      - name: Update README
        run: |
          python fetch_medium.py
          python update_facts.py

      # -------------------------
      # Streak stats
      # -------------------------

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=dark&disable_animations=false
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      # -------------------------
      # Commit everything together
      # -------------------------

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and push all changes
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config --local user.email "mydasdemir229@gmail.com"
          git config --local user.name "m-yusuf-d"

          git add README.md profile/streak.svg

          git commit -m "📝 Update profile - $(date -u '+%Y-%m-%d  %H:%M (UTC +0)')"

          git push

      - name: No changes detected
        if: steps.check_changes.outputs.changed != 'true'
        run: echo "✅ Değişiklik yok, commit oluşturulmadı."